<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 120" width="360" height="120" fill="none">
  <!-- Background matching user logo -->
  <rect width="100%" height="100%" rx="12" fill="#000000" />
  
  <!-- AE Typography -->
  <text x="24" y="62" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="52" font-weight="500" fill="#526274" letter-spacing="1">AE</text>
  
  <!-- Orange Diamond Accent (◆) to upper right of AE -->
  <polygon points="126,20 136,30 126,40 116,30" fill="#f97316" />
  
  <!-- MODULE Typography -->
  <text x="25" y="87" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="600" fill="#526274" letter-spacing="5.5">MODULE</text>
  
  <!-- AUDATEX / AZT Sub-Brand -->
  <text x="25" y="104" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="9.5" font-weight="600" fill="#526274" letter-spacing="3.5">AUDATEX / AZT</text>
</svg>
